name: Equipment allocation checks
on:
  pull_request:
  push:
    branches: [farhan/persisted-workflows]
permissions:
  contents: read
jobs:
  allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexora_allocation_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_allocation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:concurrency
        env:
          NEXORA_TEST_DATABASE_URL: postgres://postgres@localhost:5432/nexora_allocation_test
