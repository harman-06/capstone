<!--
  Nexora Health — app shell
  One HTML page for the whole site. 
  main.js fills #sidebar and #app based on the URL hash and the signed-in role; nothing here is role-specific.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora Health</title>
<link rel="stylesheet" href="css/style.css?v=20261101-operations">
</head>
<body class="signed-out">
<!-- Defines the top bar with all of its elements: nav toggle, brand, live clock (main.js), demo role switcher, signed-in user name -->
<header class="topbar" data-auth-required hidden>
  <button id="menu-btn" aria-label="Toggle menu">☰</button>
  <a class="brand" href="#/dashboard"><span class="brand-mark" aria-hidden="true">+</span> Nexora <span class="brand-light">Health</span></a>
  <span class="spacer"></span>
  <span id="clock"></span>
  <label class="role-label">Preview role <select id="role-switcher"></select></label>
  <span id="user-name" class="user-chip"></span>
</header>
  <!-- Sign-in screen (auth-ui.js). Shown instead of the app until the user signs in. -->
<section id="database-controls" class="database-controls" aria-label="Database connection">
  <div class="signin-brand"><span class="brand-mark" aria-hidden="true">+</span><span>Nexora <b>Health</b></span><small>EQUIPMENT OPERATIONS</small></div>
  <h1 id="signin-heading">Welcome back</h1>
  <p id="signin-intro">Sign in to coordinate equipment and supply requests.</p>
  <p id="database-status" role="status">Sign in to continue.</p>
  <form id="database-signin">
    <label>Staff email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in to workspace <span aria-hidden="true">→</span></button>
  </form>
  <button id="database-signout" hidden>Sign out</button>
  <button id="database-refresh" hidden>Refresh equipment</button>
  <p id="database-auth-message" role="status"></p>
</section>
<!-- Main app shell: sidebar nav (nav.js) + page content (router.js picks what renders in #app)
  Everything with [data-auth-required] stays hidden until api.js confirms a signed-in Supabase session (see auth-ui.js) -->
<div class="layout" data-auth-required hidden>
  <nav id="sidebar" aria-label="Main"></nav>
  <main id="app"></main>
</div>
<!-- config.js: public Supabase (backend model) URL + publishable key only, loaded before main.js needs it -->
<script src="js/config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
