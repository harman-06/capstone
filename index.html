<!--
  Nexora Health — app shell
  One HTML page for the whole site. 
  main.js fills #sidebar and #app based on the URL hash and the signed-in role; nothing here is role-specific.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora Health</title>
<link rel="icon" type="image/png" href="nexora-logo.png">
<link rel="stylesheet" href="css/style.css?v=20261112-shell">
</head>
<body class="signed-out">
<!-- Top bar: menu toggle, brand, clock, notification bell, account menu (topbar.js) -->
<header class="topbar" data-auth-required hidden>
  <button id="menu-btn" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="true">☰</button>
  <a class="brand" href="#/dashboard">
  <img src="nexora-logo.png"
       alt="Nexora Health"
       class="brand-logo">
</a>
  <span class="spacer"></span>
  <span id="clock"></span>
  <div class="menu-wrap">
    <button id="bell-btn" class="icon-btn" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="bell-menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
      <span id="bell-count" class="bell-count" hidden></span>
    </button>
    <div id="bell-menu" class="menu bell-menu" hidden>
      <div class="menu-title">Notifications</div>
      <div id="bell-list" class="bell-list"></div>
    </div>
  </div>
  <div class="menu-wrap">
    <button id="account-btn" class="account-btn" type="button" aria-expanded="false" aria-controls="account-menu">
      <span id="account-avatar" class="avatar" aria-hidden="true"></span>
      <span class="account-text"><span id="user-name"></span><span id="user-role"></span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="account-menu" class="menu account-menu" hidden>
      <div class="menu-head"><strong id="menu-name"></strong><span id="menu-role"></span></div>
      <a id="menu-account-link" href="#/account">View account</a>
      <a id="menu-settings-link" href="#/settings">Settings</a>
      <hr>
      <button id="menu-refresh" type="button">Refresh equipment</button>
      <button id="menu-signout" type="button">Sign out</button>
    </div>
  </div>
</header>
<div id="toast" role="status" aria-live="polite"></div>
  <!-- Sign-in screen (auth-ui.js). Shown instead of the app until the user signs in. -->
<section id="database-controls" class="database-controls" aria-label="Database connection">
<div class="signin-brand">
  <img src="nexora-logo.png"
       alt="Nexora Health"
       class="brand-logo">
  <small>EQUIPMENT OPERATIONS</small>
  </div>  
  <h1 id="signin-heading">Welcome back</h1>
  <p id="signin-intro">Sign in to coordinate equipment and supply requests.</p>
  <p id="database-status" role="status">Sign in to continue.</p>
  <form id="database-signin" method="post">
    <label>Staff email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" disabled>Sign in to workspace <span aria-hidden="true">→</span></button>
  </form>
  <button id="database-signout" hidden>Sign out</button>
  <button id="database-refresh" hidden>Refresh equipment</button>
  <p id="database-auth-message" role="status"></p>
</section>
<!-- Main app shell: sidebar nav (nav.js) + page content (router.js picks what renders in #app)
  Everything with [data-auth-required] stays hidden until api.js confirms a signed-in Supabase session (see auth-ui.js) -->
<div class="layout" data-auth-required hidden>
  <nav id="sidebar" aria-label="Main"></nav>
  <main id="app"></main>
</div>
<!-- config.js: public Supabase (backend model) URL + publishable key only, loaded before main.js needs it -->
<script src="js/config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
